# yaml-language-server: $schema=./config.schema.json
# User-facing configuration for the ATB workflow.
# Set the workflow switches, review the paths/URLs, then run:
#   python scripts/run_pipeline.py

workflow:
  scrape_raw_data: true
  format_reeds_inputs: true
  make_plots: true
  make_comparison_plots: true

atb:
  year: 2024
  release_version: 3
  dollar_year: 2022

raw_data:
  directory: scraped_input
  # Some NLR networks inspect HTTPS with an internal certificate that may not
  # be installed in the active conda environment. Normal certificate checking
  # is always attempted first; this permits a warning + verify=False retry only
  # after that check fails.
  allow_insecure_ssl_fallback: true
  flat_file:
    filename: atb_2024_flat_file.csv
    url: https://oedi-data-lake.s3.amazonaws.com/ATB/electricity/csv/2024/v3.0.0/ATBe.csv
  workbook:
    filename: atb_2024_workbook.xlsx
    url: https://data.openei.org/files/6006/2024_v3_Workbook.xlsx

# Observed project costs are downloaded and normalized by the separate
# scripts/scrape_historical_costs.py utility. Only explicitly reviewed entries
# under reeds_mappings are merged into ReEDS curves; all others remain review
# inputs.
historical_cost_sources:
  directory: scraped_input/historical_costs
  normalized_filename: historical_capital_costs.csv
  manifest_filename: source_manifest.csv
  allow_insecure_ssl_fallback: true
  # Reviewed mappings from normalized observed series into ReEDS columns.
  # Values before processing.smooth_cost_curves.projection_start_year replace
  # the corresponding manual value when that metric selects `real`. Every
  # historical metric declares its own mode below.
  reeds_mappings:
    battery:
      # Both components are derived together from the same observed total.
      capcost: &battery_total_cost
        filters:
          source_id: eia_generator_costs
          technology: battery
          metric: capital_cost
          unit: USD/kW
          source_table: major_energy_source
          statistic: capacity_weighted_mean
      capcost_energy: *battery_total_cost
    csp:
      # 2015 10-hour tower proxy; fill other years and scale using CSP cost ratios.
      capcost:
        filters:
          source_id: utility_pv
          technology: csp
          technology_detail: Crescent Dunes
          metric: capital_cost
          unit: USD/kW
          capacity_basis: AC
          statistic: project
          geography: United States
    upv:
      # Reported O&M is assigned to FOM only; VOM remains zero.
      fom:
        filters:
          source_id: utility_pv
          metric: fixed_om
          unit: USD/kW-yr
          capacity_basis: AC
          statistic: mean
          geography: United States
      cf_improvement:
        filters:
          source_id: utility_pv
          metric: capacity_factor
          unit: fraction
          capacity_basis: AC
          statistic: capacity_weighted_cumulative
          geography: United States
      capcost:
        filters:
          source_id: utility_pv
          metric: capital_cost
          unit: USD/kW
          capacity_basis: AC
          statistic: capacity_weighted_mean
          geography: United States
    # EIA reported no biomass installations in 2018, so that internal gap is
    # linearly interpolated from 2017 and 2019. Years before EIA begins in 2013
    # use the nearest real observation; no manual values are mixed into `real`.
    # Annual biomass additions are small and idiosyncratic, so the observed
    # capacity-weighted mean swings widely (1,889-4,910 $/kW over 2013-2021).
    biopower:
      capcost:
        filters:
          source_id: eia_generator_costs
          metric: capital_cost
          unit: USD/kW
          technology_detail: Biomass
          source_table: major_energy_source
    # EIA reports gas plants only as "combined cycle" or "combustion turbine";
    # Form EIA-860 has no field for turbine frame class or plant configuration,
    # so there is no observation for the H-Frame or aeroderivative variants.
    # Each series therefore describes the one variant it measures, and the
    # others generate their own history under smooth_cost_curves below. EIA
    # starts in 2013, so 2010-2012 use the nearest real observation.
    gas:
      capcost:
        series:
          - technologies:
              - Gas-CC
            filters:
              source_id: eia_generator_costs
              metric: capital_cost
              unit: USD/kW
              technology_detail: Natural gas combined cycle
              source_table: natural_gas_technology
          - technologies:
              - Gas-CT
            filters:
              source_id: eia_generator_costs
              metric: capital_cost
              unit: USD/kW
              technology_detail: Natural gas combustion turbine
              source_table: natural_gas_technology
    # Figure 31 reports one capacity-weighted mean over all offshore projects
    # with no substructure split, but by 2023 only 231 MW of the ~75 GW built
    # worldwide was floating (report Figure 18), so the series describes
    # fixed-bottom costs. It is mapped to `fixed` only; `floating` broadcasts
    # its own first ATB projection value under smooth_cost_curves below.
    # scraped_input/README.md covers the "Global" and "Asia" alternatives.
    wind-ofs:
      capcost:
        turbine_classes:
          - fixed
        filters:
          source_id: offshore_wind
          metric: capital_cost
          unit: USD/kW
          capacity_basis: nameplate
          statistic: capacity_weighted_mean
          geography: Europe and United States
    wind-ons:
      fom:
        filters:
          source_id: land_based_wind
          metric: fixed_om
          unit: USD/kW-yr
          capacity_basis: nameplate
          statistic: mean
          geography: United States
      cf_improvement:
        filters:
          source_id: land_based_wind
          metric: capacity_factor
          unit: fraction
          capacity_basis: nameplate
          statistic: generation_weighted_mean
          geography: United States
      capcost:
        filters:
          source_id: land_based_wind
          metric: capital_cost
          unit: USD/kW
          capacity_basis: nameplate
          statistic: capacity_weighted_mean
          geography: United States
  battery_cost_split:
    reference_year: 2022
    reference_scenario: Moderate
    duration_filters:
      source_id: eia860_storage
      technology: battery
      metric: storage_duration
      unit: hours
      statistic: capacity_weighted_cohort
  sources:
    eia860_storage:
      enabled: true
      first_year: 2016
      last_year: 2024
      first_cohort_year: 2015  # Taken from the 2016 inventory.
      page_url: https://www.eia.gov/electricity/data/eia860/
      current_data_url: https://www.eia.gov/electricity/data/eia860/xls/eia8602024.zip
      archive_data_url: https://www.eia.gov/electricity/data/eia860/archive/xls/eia860{year}.zip
      filename: eia860_{year}.zip
    land_based_wind:
      enabled: true
      report_year: 2025
      page_url: https://emp.lbl.gov/publications/land-based-wind-energy-technology
      data_url: https://eta-publications.lbl.gov/sites/default/files/2025-08/data_file_land-based_wind_energy_technology_update_2025_edition.xlsx
      filename: lbnl_land_based_wind_2025.xlsx
    utility_pv:
      enabled: true
      report_year: 2025
      page_url: https://emp.lbl.gov/publications/us-utility-scale-solar-2025-data
      data_url: https://eta-publications.lbl.gov/sites/default/files/2025-10/2025_utility-scale_solar_data_update.xlsx
      filename: lbnl_utility_scale_solar_2025.xlsx
    offshore_wind:
      enabled: true
      report_year: 2024
      # Projects after 2023 in this workbook are pipeline/projection data, not
      # completed historical observations, so the normalized CSV stops at 2023.
      last_historical_year: 2023
      page_url: https://www.nlr.gov/wind/offshore-market-assessment
      data_url: https://www.nlr.gov/docs/fy24osti/90525data.xlsx
      filename: nlr_offshore_wind_market_2024.xlsx
    eia_generator_costs:
      enabled: true
      first_year: 2013
      last_year: 2024
      page_url: https://www.eia.gov/electricity/generatorcosts/
      current_data_url: https://www.eia.gov/electricity/generatorcosts/xls/generator_costs.xlsx
      archive_data_url: https://www.eia.gov/electricity/generatorcosts/archive/{year}/xls/generator_costs_{year}.xlsx
      filename: eia_generator_costs_{year}.xlsx

# Archived ATB estimates; each release contributes only its base year.
historical_atb:
  directory: scraped_input/historical_atb
  normalized_filename: historical_atb.csv
  missing_series: broadcast  # options: manual / broadcast / error
  releases:
    2015:
      - format: workbook
        filename: atb_2015_workbook.xlsm
        dollar_year: 2013
        url: https://docs.nlr.gov/docs/fy15osti/64077-DA.xlsm
    2016:
      - format: workbook
        filename: atb_2016_workbook.xlsm
        dollar_year: 2014
        url: https://docs.nlr.gov/docs/fy16osti/66944-DA.xlsm
    2017:
      - format: workbook
        filename: atb_2017_workbook.xlsm
        dollar_year: 2015
        url: https://data.nlr.gov/system/files/71/2017-ATB-data.xlsm
    2018:
      - format: workbook
        filename: atb_2018_workbook.xlsm
        dollar_year: 2016
        url: https://data.nlr.gov/system/files/89/2018-ATB-data-interim-geo.xlsm
    2019:
      - format: workbook
        filename: atb_2019_workbook.xlsm
        dollar_year: 2017
        url: https://data.nlr.gov/system/files/115/2019-ATB-data.xlsm
    2020:
      # The published workbook serves 2019 data; use the verified 2020 CSV.
      - format: flat
        filename: atb_2020_flat_file.csv
        dollar_year: 2018
        url: https://oedi-data-lake.s3.amazonaws.com/ATB/electricity/csv/2020/ATBe.csv
    2021:
      - format: workbook
        filename: atb_2021_workbook.xlsm
        dollar_year: 2019
        url: https://data.openei.org/files/4129/2021-ATB-Data_Master_new.xlsm
    2022:
      - format: workbook
        filename: atb_2022_workbook.xlsx
        dollar_year: 2020
        url: https://data.openei.org/files/5716/2022 v3 Annual Technology Baseline Workbook Mid-year update 2-15-2023.xlsx
    2023:
      - format: flat
        filename: atb_2023_flat_file.csv
        dollar_year: 2021
        url: https://oedi-data-lake.s3.amazonaws.com/ATB/electricity/csv/2023/ATBe.csv
      - format: battery
        filename: atb_2023_workbook.xlsx
        dollar_year: 2021
        url: https://data.openei.org/files/5865/2023-ATB-Data_Master_v9.0.xlsx

processing:
  reeds_repo: C:/ReEDS/ReEDS
  output_directory: output
  copy_to_reeds: false
  technologies: all
  update_costs: true
  update_financials: false
  sensitivity_name: null
  reeds_start_year: 2010
  decimals: 6
  # Optional treatment of the historical/projection boundary and future ATB
  # trajectory. Each technology explicitly selects a historical mode for every
  # modeled metric and its future-year smoothing switches.
  smooth_cost_curves:
    enabled: true
    method: selective
    # "all" smooths every monetary column (capcost*, fom*, vom); rounding
    # artifacts are no more real in O&M than in capital cost. Historical source
    # choices below apply to every metric independently of this selector.
    # Capacity-factor multipliers are still included automatically where used.
    # Heat rate is not monetary and is never smoothed by "all".
    columns: all
    # Years before this boundary are historical; this year and later are the
    # current ATB projection. Change this once here rather than in the code.
    projection_start_year: 2022
    # A relative change in adjacent annual slopes at or above this value is a
    # possible kink. Only clusters of 2+ changes are smoothed.
    slope_change_threshold: 0.4
    max_kink_years: 4
    # Year-to-year transitions of 10% or more are published milestones and are
    # never smoothed. Runs of equal values are left alone too: a flat stretch
    # is how ATB states that a cost stops improving.
    major_step_relative_threshold: 0.1
    # Keep the original ATB value when a proposed future adjustment is smaller
    # than 0.5%. This prevents visually insignificant smoothing changes.
    minimum_adjustment_relative_threshold: 0.005
    # historical_data values (editor dropdowns are supplied by the schema):
    #   real          use observed history; interpolate internal missing years
    #   atb           use archived ATB base-year estimates; fill missing years
    #   manual        preserve manual_input/historical exactly
    #   broadcast     use the first ATB projection value for all history years
    # Source priority: real, then atb, then broadcast when no archive matches.
    # Every technology listed below is processed. Capacity-factor multipliers
    # are included automatically when the technology output contains one.
    technologies:
      upv:
        historical_data:
          capcost: real  # options: real / atb / manual / broadcast
          fom: real  # options: real / atb / manual / broadcast
          vom: atb  # options: atb / manual / broadcast
          cf_improvement: real  # options: real / atb / manual / broadcast
        future_smoothing_treatments:
          smooth_projection_curve: true  # options: true / false
      wind-ons:
        historical_data:
          capcost: real  # options: real / atb / manual / broadcast
          fom: real  # options: real / atb / manual / broadcast
          vom: atb  # options: atb / manual / broadcast
          cf_improvement: real  # options: real / atb / manual / broadcast
        future_smoothing_treatments:
          smooth_projection_curve: true  # options: true / false
      wind-ofs:
        historical_data:
          # Observed offshore CapEx is a fixed-bottom series, so only that
          # class reads it. No floating cost history exists to observe.
          capcost:
            fixed: real  # options: real / atb / manual / broadcast
            floating: atb  # options: atb / manual / broadcast
          fom: atb  # options: atb / manual / broadcast
          vom: atb  # options: atb / manual / broadcast
          cf_improvement: atb  # options: atb / manual / broadcast
          rsc_mult: broadcast  # options: manual / broadcast
        future_smoothing_treatments:
          smooth_projection_curve: true  # options: true / false
      battery:
        historical_data:
          capcost: real  # options: real / atb / manual / broadcast (select both together)
          capcost_energy: real  # options: real / atb / manual / broadcast
          fom: atb  # options: atb / manual / broadcast
          fom_energy: atb  # options: atb / manual / broadcast
          vom: atb  # options: atb / manual / broadcast
          rte: broadcast  # options: manual / broadcast
        future_smoothing_treatments:
          smooth_projection_curve: true  # options: true / false
      csp:
        historical_data:
          capcost: real  # options: real / atb / manual / broadcast
          fom: atb  # options: atb / manual / broadcast
          vom: atb  # options: atb / manual / broadcast
        future_smoothing_treatments:
          smooth_projection_curve: true  # options: true / false
      coal:
        historical_data:
          capcost: atb  # options: atb / manual / broadcast
          fom: atb  # options: atb / manual / broadcast
          vom: atb  # options: atb / manual / broadcast
          heatrate: atb  # options: atb / manual / broadcast
        future_smoothing_treatments:
          smooth_projection_curve: true  # options: true / false
      coal-ccs:
        historical_data:
          capcost: atb  # options: atb / manual / broadcast
          fom: atb  # options: atb / manual / broadcast
          vom: atb  # options: atb / manual / broadcast
          heatrate: atb  # options: atb / manual / broadcast
        future_smoothing_treatments:
          smooth_projection_curve: true  # options: true / false
      gas:
        historical_data:
          # Only the plain combined-cycle and combustion-turbine plants have an
          # EIA observation. The H-Frame and aeroderivative variants have none,
          # so they generate their own history instead of borrowing one.
          capcost:
            Gas-CC: real  # options: real / atb / manual / broadcast
            Gas-CC_H_1x1: atb  # options: atb / manual / broadcast
            Gas-CC_H_2x1: atb  # options: atb / manual / broadcast
            Gas-CT: real  # options: real / atb / manual / broadcast
            Gas-CT_aero: atb  # options: atb / manual / broadcast
          fom: atb  # options: atb / manual / broadcast
          vom: atb  # options: atb / manual / broadcast
          heatrate: atb  # options: atb / manual / broadcast
        future_smoothing_treatments:
          smooth_projection_curve: true  # options: true / false
      gas-ccs:
        historical_data:
          capcost: atb  # options: atb / manual / broadcast
          fom: atb  # options: atb / manual / broadcast
          vom: atb  # options: atb / manual / broadcast
          heatrate: atb  # options: atb / manual / broadcast
        future_smoothing_treatments:
          smooth_projection_curve: true  # options: true / false
      fuelcell:
        historical_data:
          capcost: atb  # options: atb / manual / broadcast
          fom: atb  # options: atb / manual / broadcast
          vom: atb  # options: atb / manual / broadcast
          heatrate: atb  # options: atb / manual / broadcast
        future_smoothing_treatments:
          smooth_projection_curve: true  # options: true / false
      nuclear:
        historical_data:
          capcost: atb  # options: atb / manual / broadcast
          fom: atb  # options: atb / manual / broadcast
          vom: atb  # options: atb / manual / broadcast
          heatrate: atb  # options: atb / manual / broadcast
        future_smoothing_treatments:
          smooth_projection_curve: true  # options: true / false
      nuclear-smr:
        historical_data:
          capcost: atb  # options: atb / manual / broadcast
          fom: atb  # options: atb / manual / broadcast
          vom: atb  # options: atb / manual / broadcast
          heatrate: atb  # options: atb / manual / broadcast
        future_smoothing_treatments:
          smooth_projection_curve: true  # options: true / false
      biopower:
        historical_data:
          capcost: real  # options: real / atb / manual / broadcast
          fom: atb  # options: atb / manual / broadcast
          vom: atb  # options: atb / manual / broadcast
          heatrate: atb  # options: atb / manual / broadcast
        future_smoothing_treatments:
          smooth_projection_curve: true  # options: true / false

# Versioned ReEDS history used before each ATB projection series begins.
# Set seed_missing_from_reeds to true only when initializing a missing file from
# processing.reeds_repo. Formatting does not append ATB values here;
# archived base years are stored under historical_atb.directory.
historical_data:
  directory: manual_input/historical
  dollar_year: 2022
  seed_missing_from_reeds: false

plotting:
  metrics:
    - CAPEX
    - Fixed O&M
    - Variable O&M
  case: Market
  crp_years: 20
  figure_format: png
  output_directory: figures
  # Before/after plots are versioned; their unsmoothed inputs are held only in
  # a temporary directory while the full pipeline is running.
  smoothing_comparison_directory: comparison/smoothing_comparison
  technologies:
    - Biopower
    - Coal_FE
    - CSP
    - LandbasedWind
    - NaturalGas_FE
    - Nuclear
    - OffShoreWind
    - Utility-Scale Battery Storage
    - UtilityPV
